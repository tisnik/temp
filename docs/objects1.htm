<html>
    <head>
        <title>js properties</title>
        <script type="text/javascript" src="fengari-web.js"></script>
    </head>
    <body>
        <script type="text/lua">
        function write(what)
            js.global.document:write(what)
        end
 
        write("<table border>")
        for key, value in pairs(js) do
            write("<tr><td>")
            write(key)
            write("</td><td>")
            write(value)
            write("</td></tr>")
        end
        write("</table>")
        </script>
    </body>
</html>
