<!doctype html>
<html>
    <head>
        <title>WebGL: texturesC</title>
    </head>
    <body>
        <!-- kreslicí plátno -->
        <canvas id="web_gl_canvas" width="256" height="256"></canvas>

        <br />

        <label>
            <span>Blending enabled</span>
            <input type="checkbox" id="enable_blending" onchange="draw()">
        </label>

        <br />

        <label>
            <span>Blending function #1</span>
            <select id="blending_func_1" onchange="draw()">
                <option value="ZERO">ZERO</option>
                <option value="ONE">ONE</option>
                <option value="SRC_ALPHA" selected>SRC_ALPHA</option>
                <option value="SRC_ALPHA_SATURATE">SRC_ALPHA_SATURATE</option>
                <option value="ONE_MINUS_SRC_ALPHA">ONE_MINUS_SRC_ALPHA</option>
                <option value="DST_ALPHA">DST_ALPHA</option>
                <option value="ONE_MINUS_DST_ALPHA">ONE_MINUS_DST_ALPHA</option>
                <option value="DST_COLOR">DST_COLOR</option>
                <option value="ONE_MINUS_DST_COLOR">ONE_MINUS_DST_COLOR</option>
            </select>
        </label>

        <br />

        <label>
            <span>Blending function #2</span>
            <select id="blending_func_2" onchange="draw()">
                <option value="ZERO">ZERO</option>
                <option value="ONE">ONE</option>
                <option value="SRC_COLOR">SRC_COLOR</option>
                <option value="ONE_MINUS_SRC_COLOR">ONE_MINUS_SRC_COLOR</option>
                <option value="SRC_ALPHA">SRC_ALPHA</option>
                <option value="ONE_MINUS_SRC_ALPHA" selected>ONE_MINUS_SRC_ALPHA</option>
                <option value="DST_ALPHA">DST_ALPHA</option>
                <option value="ONE_MINUS_DST_ALPHA">ONE_MINUS_DST_ALPHA</option>
            </select>
        </label>

        <br />

        <label>
            <span>R</span>
            <input type="range" id="r" min="0" max="1" step="0.01" value="0" onchange="draw()">
        </label>

        <br />

        <label>
            <span>G</span>
            <input type="range" id="g" min="0" max="1" step="0.01" value="0" onchange="draw()">
        </label>

        <br />

        <label>
            <span>B</span>
            <input type="range" id="b" min="0" max="1" step="0.01" value="0" onchange="draw()">
        </label>

        <br />

        <label>
            <span>A</span>
            <input type="range" id="a" min="0" max="1" step="0.01" value="1" onchange="draw()">
        </label>

        <!-- skript, který kreslicí plátno využije -->
        <script type="application/javascript" src="texturesC.js"></script>

    </body>
</html>
