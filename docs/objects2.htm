<html>
    <head>
        <title>js properties</title>
        <script type="text/javascript" src="fengari-web.js"></script>
    </head>
    <body>
        <script type="text/lua">
        function write(what)
            js.global.document:write(what)
        end
 
        function getKeys(tbl)
            local keys = {}
            for key, _ in pairs(tbl) do
                table.insert(keys, key)
            end
            table.sort(keys)
            return keys
        end
 
        write("<table border>")
        local keys = getKeys(js.global)
        for _, key in ipairs(keys) do
           write("<tr><td>")
           write(key)
           write("</td><td>")
           local value = js.global[key]
           local valueType = type(value)
           write(valueType)
           write("</td><td>")
           if valueType == "boolean" or valueType == "string" or valueType == "number" then
               write(value)
           end
           write("</td></tr>")
        end
        write("</table>")
        </script>
    </body>
</html>
